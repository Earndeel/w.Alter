<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>W.Alter</title>
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div id="app">
  <div id="scrim" hidden></div>
  <aside id="sidebar" aria-label="Navigation">
    <div class="side-head">
      <span class="brand" id="brand">W.Alter</span>
    </div>
    <button id="new-chat" class="btn primary" type="button">+ Nouvelle conversation</button>
    <nav class="side-scroll">
      <div class="side-title">Conversations</div>
      <ul id="sessions" class="list"></ul>
      <div id="panels-wrap" hidden>
        <div class="side-title">Panneaux</div>
        <ul id="panels" class="list"></ul>
      </div>
      <div id="links-wrap" hidden>
        <div class="side-title">Liens</div>
        <div id="links"></div>
      </div>
    </nav>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu">&#9776;</button>
      <div id="title" class="title">W.Alter</div>
      <span id="busy-dot" class="busy-dot" hidden title="En cours"></span>
    </header>
    <div id="banner" class="banner" role="alert" hidden></div>
    <section id="chat">
      <div id="messages" aria-live="polite">
        <div id="welcome" class="welcome">
          <div class="welcome-name" id="welcome-name">W.Alter</div>
          <div class="welcome-tag" id="welcome-tag">Bonjour Monsieur. Que puis-je faire pour vous ?</div>
        </div>
        <div id="thread"></div>
        <div id="working" class="working" hidden><span class="spinner"></span> W.Alter travaille…</div>
      </div>
      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Écrivez à W.Alter…" enterkeyhint="send"></textarea>
        <button id="stop" class="btn danger" type="button" hidden>Arrêter</button>
        <button id="send" class="btn primary" type="submit">Envoyer</button>
      </form>
    </section>
    <section id="panel-view" hidden>
      <iframe id="panel-frame" title="Panneau" referrerpolicy="same-origin"></iframe>
    </section>
  </main>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
