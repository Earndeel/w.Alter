# Walter end-to-end minimal scenario — enriched at each milestone (P0 2026-10-27: run; P1: routed sub-agent + Browse).
# Plays a request through the real hook adapter and the real walter-core MCP server (the Claude Code path: the server
# finds the run through its parent's record), then asserts on what the tables recorded.
name: e2e-minimal
milestone: P1
qualifies:
  - {harness: claude-code, capability: browse, scope: "a successful routed sub-agent returns two distinct sourced offers through walter_browse; snippets are labelled, missing prices remain explicit"}
  - {harness: claude-code, capability: logs, scope: "the run and the sub-agent's full trace are recorded and linked"}
  - {harness: claude-code, capability: model, scope: "sub-agents run on the Router's choice (the main model stays the harness's)"}
steps:
  - hook: {event: UserPromptSubmit, prompt: "Scénario e2e-minimal : offres de café glacé 7-Eleven en Thaïlande."}
  - mcp:
      tool: walter_run
      arguments:
        request: "Recherche web : prix de cafés glacés All Café (7-Eleven Thaïlande)."
        goal: >-
          Trouve 2 offres réelles de café glacé All Café vendues par 7-Eleven en Thaïlande. Utilise walter_browse
          (recherche puis lecture des pages). Pour chaque offre : produit, prix en THB, volume si visible, URL source.
          N'invente rien : écris la chaîne littérale "inconnu" si prix ou volume manque. Un prix connu est un
          nombre JSON sans guillemets (55, jamais "55"). Réponds uniquement avec {"offers": [...]} ; chaque offre
          contient product (nom texte), price_thb (nombre JSON ou "inconnu"), volume (texte ou "inconnu"),
          source_url (URL texte), method (search_snippet|http|static_html|browser|api). Si seule une recherche est
          lisible, utilise "search_snippet". N'annonce une page lue (http, static_html, browser ou api) qu'après un
          appel walter_browse sur son URL réussi avec un contenu retourné ; sinon ne fabrique pas cette preuve.
        task: research
        level: L2
        max_turns: 12
        budget_seconds: 300
  - hook: {event: Stop}
assertions:
  - {path: run.status, equals: ended}
  - {path: "links[*].kind", contains: session}
  - {path: tasks, min_len: 1}
  - {path: "tasks[*].kind", contains: walter_run}
  - {path: model_calls, min_len: 1}
  - {tool_called: walter_browse}
  - {path: "tasks[*].status", all: ended}
  - {path: "tasks[*].result.ok", all: true}
  - {task_offers: 2, kind: walter_run}
