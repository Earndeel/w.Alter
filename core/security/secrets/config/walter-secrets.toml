# Walter Secrets — shipped defaults, identical for every instance. The active instance overrides them in its
# config/secrets/walter-secrets.toml (`walter instance config secrets walter-secrets.toml`).
# Paths: absolute, ~/... (service user's home) or @instance/... (the active instance).
[paths]
legacy_data_root = "@instance/state/secrets"
session = "@instance/bootstrap/bw-session"
bootstrap_vault = "@instance/bootstrap/vault.json.age"
bootstrap_key = "@instance/bootstrap/age-key.txt"
audit = "@instance/logs/walter-secrets.jsonl"
attachments = "/dev/shm/walter-secrets"
bitwarden_data = "~/.config/Bitwarden CLI/data.json"
recovery_recipient = "@instance/bootstrap/walter-recovery.pub"
backup_dir = "@instance/backups/bitwarden"

[bitwarden]
server = ""                # the instance's vault, set when the vault account is connected
email = ""

[otp]
beeper_api = "http://127.0.0.1:23373"

[sync]
env_files = []

[react]
self_names = []            # owner's names, pseudonymised before any model call
remote = ""                # rclone destination of vault exports; empty = local copies only
min_items = 1              # an export with fewer items means a broken session
