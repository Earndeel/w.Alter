# Code belongs to Walter Secrets. Existing encrypted data locations are retained
# as deployment bindings; neither the Hermes process nor its Python package is required.
[paths]
legacy_data_root = "/root/.hermes"
unlock = "/opt/walter-secrets/bin/bw-unlock"
session = "/root/.hermes/vault/.bw_session_key"
bootstrap_vault = "/root/.hermes/vault/vault.json.age"
bootstrap_key = "/root/.hermes/vault/age-key.txt"
audit = "/root/.hermes/logs/walter-secrets.jsonl"
attachments = "/dev/shm/walter-secrets"
memory_module = "/opt/walter-memory"
bitwarden_data = "/root/.config/Bitwarden CLI/data.json"
recovery_recipient = "/root/.hermes/vault/walter-recovery.pub"
backup_dir = "/root/.hermes/backups/bitwarden"

[bitwarden]
server = "https://lucas-bitwarden.duckdns.org"
email = "lucas.jouvencon@gmail.com"

[otp]
beeper_api = "http://100.127.150.1:23373"

[sync]
env_files = ["/root/.hermes/.env", "/opt/walter-voice-memory/.env", "/root/.hermes/hindsight/hybrid-search.env", "/root/.hermes/hindsight/write-worker.env", "/root/.hermes/hindsight/.env.service", "/root/.hermes/voice-bridge.env", "/root/.hermes/vault/secrets-sync-canary.env"]

[[env_consumers]]
path = "/root/.hermes/.env"
unit = "hermes-gateway.service"
user = true
restart = ["/root/.hermes/hermes-agent/venv/bin/hermes", "gateway", "restart"]
