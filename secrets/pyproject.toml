[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walter-secrets"
version = "1.0.0"
description = "Runtime-independent Walter vault access and secret-safe local execution"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["walter_secrets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
