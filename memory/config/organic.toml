# Memory V1 "organic memory" switches (P1). The instance overrides this file with
# `walter instance config memory organic.toml` (an instance copy under its config/memory/).
# Every P1 step ships behind its switch; false = the behaviour before that step.

[generations]
# P1.0: read derived knowledge only from readable generations (core.generations); false = no generation filter.
enforce = true

[working_memory]
# P1.1: "adaptive" (2026-11-03, owner: integrate, no long shadow) = the adaptive trigger drives extraction (long,
# marked or directive owner messages at once, the rest grouped) and the working state is injected by Context;
# "shadow" = extraction keeps its 20-minute policy, states only recorded (extraction.working_shadow); "off" = neither.
mode = "adaptive"

[consolidation]
# P1.2: g1 subject views rebuilt from current V1 knowledge and evidence (status 'shadow': built, not served).
# "active" (2026-11-03) = views served, reconsolidation applies only the safe proposals (strict duplicates, finished
# task items, replaced decisions; never closes a durable rule — those stay proposals in views.ledger);
# "shadow" = views built, proposals recorded only; "off" = nothing.
mode = "active"
# Router tier for reconsolidation (the memory_extraction route proposed nothing on real subjects; L3 did, 2026-11-02)
poste = "general/L3"

[episodes]
# P1.4-P1.5 (2026-11-03): flows (GPS visits computed on the VM, conversation bursts, appointments, work sessions) and
# multi-source episodes every `every_s`; dated plans read from pseudonymised conversation bursts (one model call per
# burst where the owner wrote and a time is mentioned) every `plans_every_s`, at most `plans_per_run` bursts.
# "off" = none of it. Hypotheses never go past "probable" without the owner's words (`attest`: decision model).
mode = "active"
every_s = 600
plans_every_s = 1800
plans_per_run = 20
attest = true

[periods]
# P1.6: the owner's local time zone for days, weeks and months.
tz = "Asia/Bangkok"

[kardex]
# Kardex enrichment (2026-11-03): once a day, the `per_run` people the owner exchanged with most in 1:1 recently; their
# last `days` of messages (redacted_cloud only, pseudonymised) → claims about the CONTACT only, status proposed,
# sensitivity tightened by type, mention policy derived. "off" = only on demand (walter-memory organic kardex).
mode = "daily"
per_run = 5
days = 60
max_messages = 160

[privacy]
# What a cloud reader (a cloud model's context, MCP tools of cloud agents) may read (Monsieur, 2026-11-03: « tout peut
# rentrer dans le contexte des modèles cloud pour l'instant, pas besoin de pseudonymiser »): "redacted_cloud" =
# messaging content (Beeper, Gmail, Kardex) enters cloud contexts as is; "cloud_allowed" = the stricter rule before.
# local_only (GPS, places, conversations marked local) never leaves, whatever this says.
cloud_context = "redacted_cloud"
# true = redacted_cloud content is pseudonymised before any cloud model call (extraction, decisions, logs for agents).
pseudonymise = false
