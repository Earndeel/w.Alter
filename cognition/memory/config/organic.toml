# Memory V1 "organic memory" switches (P1). The instance overrides this file with
# `walter instance config memory organic.toml` (an instance copy under its config/memory/).
# Every P1 step ships behind its switch; false = the behaviour before that step.

[generations]
# P1.0: read derived knowledge only from readable generations (core.generations); false = no generation filter.
enforce = true

[working_memory]
# P1.1: "shadow" = extraction keeps its 20-minute policy; the working state and the adaptive decisions are only
# recorded (extraction.working_shadow), nothing new is injected. "adaptive" = the adaptive trigger drives extraction.
# "off" = no working-state records.
mode = "shadow"

[consolidation]
# P1.2: g1 subject views rebuilt from current V1 knowledge and evidence (status 'shadow': built, not served).
# "shadow" = views built, reconsolidation proposals recorded only; "apply" = proposals applied; "off" = nothing.
mode = "shadow"
# Router tier for reconsolidation (the memory_extraction route proposed nothing on real subjects; L3 did, 2026-11-02)
poste = "general/L3"
