# Memory V1 "organic memory" switches (P1). The instance overrides this file with
# `walter instance config memory organic.toml` (an instance copy under its config/memory/).
# Every P1 step ships behind its switch; false = the behaviour before that step.

[generations]
# P1.0: read derived knowledge only from readable generations (core.generations); false = no generation filter.
enforce = true

[extraction]
# 2026-11-14 (owner: « met l'extraction de mémoire en pause pour l'instant », the extraction chain is to be redesigned):
# "paused" = no model-driven derivation of conversations — L3 extraction, subject cards (views), reconsolidation,
# run-episode summaries. Ingestion, search index, GPS flows, triage, Kardex and media keep running; pending messages
# stay uncovered and are taken up on "active". Restart walter-memory-pipeline after a change.
mode = "paused"
# E2E 20/11 (owner: « l'extraction doit aussi traiter les messages entrants et sortants de mes contacts, y compris les
# transcriptions audio … sans créer un nouveau système d'extraction relationnelle concurrent »): "single" = the owner's
# 1:1 conversations with his contacts (Beeper) go through this same extraction, live from extraction.state
# ['contacts_start'] (never their history); "off" = runtimes only.
contacts = "single"

[stages]
# A2 (2026-11-19, owner: « Sépare les interrupteurs »): one switch per model-driven stage, "active" | "paused". A stage
# left out follows [extraction] mode above. extraction = L3 extraction of conversations (live worker; an explicit
# backfill runs under the Codex quota guard whatever this says); subjects = attaching exchanges to subjects and their
# cards (views); reconsolidation = consolidate.reconsolidate; episode_summaries = run-episode summaries.
# Restart walter-memory-pipeline after a change. State: `walter-memory health` → stages.
# 2026-11-19 production (owner: « mets la consolidation organique en production … réactive l'extraction continue sur
# les nouveaux événements … conserve l'ancienne reconsolidation et les résumés redondants désactivés »): extraction
# active from extraction.state['live_start'] (the backlog before it goes through backfill in slices); subject cards,
# reconsolidation and episode summaries stay paused.
extraction = "active"
# catchup = the history before live_start, oldest first, one slice per run of walter-memory-catchup.timer (hourly;
# extract2.catchup: stops over the Codex quota and resumes on a later run; "paused" stops it without losing anything).
catchup = "active"
# reconcile_existing = existing knowledge never reconciled (written before 19/11 10:40 or judged "new"), newest first,
# through the same candidates, decision and write gate (knowledge.reconcile_existing), one slice per catch-up run.
reconcile_existing = "active"
# M5 (2026-11-25, owner: « je valide M1 à M5 ») : la boucle de rattrapage type la nature et la portée de chaque
# connaissance qui n'en a pas (nature.retype, même poste et mêmes définitions que l'extraction, porte d'écriture,
# étiquette réversible knowledge.revert). "paused" tant que les bancs ne sont pas présentés à Monsieur.
retype = "paused"
subjects = "paused"
reconsolidation = "paused"
episode_summaries = "paused"

# [quota] removed 2026-11-20 (owner: « aucune limitation artificielle de quota »): no percentage gate. Memory's work
# waits only on a real provider refusal of every route (walter_memory/quota.py: one hold per poste, until the reset
# the Router reports or 15 min); dollar limits stay in system.budgets (monthly, hard stop) and the paid floor.

[reconcile]
# Lot 1 of the consolidation loop (2026-11-19, owner mission « première boucle de consolidation organique »): every
# statement extracted from a conversation is reconciled with current knowledge before it is written (knowledge.py).
# mode: "decision" = Walter Decision (need memory.reconcile, one batched decision per segment) when no deterministic
# rule settles it; "deterministic" = only the rules (no candidate → new, same text → confirms), else new;
# "model" = rollback: the extraction model's own references (same_as / supersedes / contradicts) as before lot 1.
mode = "decision"
candidates = 5          # current items compared with each statement (hybrid search + this thread)
existing_candidates = 8 # the same for the pass over existing knowledge (its subjects are older and denser)
batch = 12              # statements per decision (2 questions each, ≤ 32 per decision)
min_confidence = 0.5    # below it, a correction / replacement / contradiction is kept as new (maybe_updates)
state_ttl_days = 7      # a transient state without an end date expires after this (task-scoped knowledge expires
                        # when its work stops: consolidate.expire)

[working_memory]
# P1.1: "adaptive" (2026-11-03, owner: integrate, no long shadow) = the adaptive trigger drives extraction (long,
# marked or directive owner messages at once, the rest grouped) and the working state is injected by Context;
# "shadow" = extraction keeps its 20-minute policy, states only recorded (extraction.working_shadow); "off" = neither.
mode = "adaptive"

[rules]
# Règles de Monsieur injectées à chaque message (couche stable de Context ; plan payload, lot 1, 2026-11-23).
# "all" = toute règle en vigueur peut remplir la couche, les plus récentes d'abord (comportement d'avant) ;
# "instructions" = seules les consignes que Monsieur a données à Walter lui-même, hors sujet d'un projet, sont
# toujours candidates ; les règles apprises dans ses conversations avec ses contacts (canal contact) ou propres à un
# projet ne viennent que si le message s'y rapporte (proximité locale). Retour arrière immédiat : remettre "all".
# Sans message (appel du Router), rien n'est filtré.
always = "instructions"
relevance_only_channels = ["contact"]
relevance_only_subjects = ["project:"]

[nature]
# Nature × portée des connaissances (2026-11-25, M1–M5 validés par Monsieur ; nature.py). Deux dimensions
# indépendantes : la nature (consigne, préférence, opinion, fait, décision, objectif = attributes.act) et la portée
# (universelle, projet, domaine, personne, situation, tâche = attributes.reach / reach_on).
# extraction : "v3" = prompt typé du 19/11 (préférence et contrainte mêlées) ; "v4" = consigne, opinion et portée.
# restitution : "rules" = couche « Règles durables » choisie par genre (avant) ; "applicable" = seules les consignes
# applicables au message sont des instructions, les préférences viennent à part et seulement si le message s'y
# rapporte, opinions et faits seulement par la mémoire pertinente (M3). Retour arrière : remettre "v3" / "rules".
# 2026-11-26 (Monsieur : « je valide M1 à M5 et le reclassement réversible du stock ») : stock retypé sous l'étiquette
# retype-2026-11-26 (765 éléments, 3 incertains gardés tels quels ; knowledge.revert l'annule), restitution active.
extraction = "v4"
restitution = "applicable"

[consolidation]
# P1.2: g1 subject views rebuilt from current V1 knowledge and evidence (status 'shadow': built, not served).
# "active" (2026-11-03) = views served, reconsolidation applies only the safe proposals (strict duplicates, finished
# task items, replaced decisions; never closes a durable rule — those stay proposals in views.ledger);
# "shadow" = views built, proposals recorded only; "off" = nothing.
mode = "active"
# Router tier for reconsolidation (the memory_extraction route proposed nothing on real subjects; L3 did, 2026-11-02)
poste = "general/L3"

[episodes]
# P1.4-P1.5 (2026-11-03): flows (GPS visits computed on the VM, conversation bursts, appointments, work sessions) and
# multi-source episodes every `every_s`; dated plans read from pseudonymised conversation bursts (one model call per
# burst where the owner wrote and a time is mentioned) every `plans_every_s`, at most `plans_per_run` bursts.
# "off" = none of it. Hypotheses never go past "probable" without the owner's words (`attest`: decision model).
mode = "active"
# engine (2026-11-03): "events" = event-driven assimilation (memory.organic consumer: only what each event touches,
# model decisions reused while their inputs are unchanged); "timer" = the former window rebuild every `every_s`
# (now harmless: unchanged rows are not rewritten, decisions are reused) — kept as the rollback switch; restart
# walter-memory-pipeline after a change
engine = "events"
every_s = 600
plans_every_s = 1800
plans_per_run = 20
attest = true

[periods]
# P1.6: the owner's local time zone for days, weeks and months.
tz = "Asia/Bangkok"

[kardex]
# Kardex enrichment (2026-11-03): once a day, the `per_run` people the owner exchanged with most in 1:1 recently; their
# last `days` of messages (redacted_cloud only, pseudonymised) → claims about the CONTACT only, status proposed,
# sensitivity tightened by type, mention policy derived. "off" = only on demand (walter-memory organic kardex).
# E2E 20/11: "canonical" = no daily claims any more: what contacts say is extracted by the organic extraction
# ([extraction] contacts) into the canonical knowledge the person card and the relation state read (one truth; a
# contact's newer word replaces his older one). Rollback = "daily". Claims already recorded stay readable.
mode = "canonical"
per_run = 5
days = 60
max_messages = 160

[privacy]
# What a cloud reader (a cloud model's context or call, MCP tools of cloud agents) may read. Monsieur, 2026-11-03:
# « Oui tout » — Walter has no local model, all its reasoning is cloud: "local_only" = everything (GPS, places,
# conversations marked local, messaging). Earlier values: "redacted_cloud", "cloud_allowed" (the strict rule).
# Classes stay on every row; what goes to a PERSON is decided apart (disclosure check on outgoing messages).
cloud_context = "local_only"
# false = no pseudonymisation before a cloud model call or in a cloud context (real names).
pseudonymise = false
# "full" = the cloud model reasons with everything Kardex knows about people (each claim tagged when it must never be
# repeated to someone else); "policy" = the filtered view used before.
kardex_cloud = "full"

[media]
# A5 (SOCLE, 2026-11-11): every Raw Vault object gets a derived text found from its message (walter_memory/media.py).
# A new object is derived by the event-driven assimilation (bus memory.object → processing key media.derive); the
# history by `walter-memory media backfill --kind K` (dry run unless --apply). "on" | "off" per kind group.
# audio → transcript (Router poste `stt`); document → local extraction, no model; image/screenshot → OCR / caption
# (Router poste `vision`, off until Monsieur fixes the catch-up budget); video → not derived (out of scope).
audio = "on"
document = "on"
image = "off"
video = "off"
# above these sizes an object is recorded as derived with empty text, meta.media.reason = "too_large"
max_audio_mb = 25
max_document_mb = 50
max_image_mb = 15
# extracted / transcribed text kept on core.objects (characters)
max_text_chars = 20000
# default number of objects per backfill run (CLI --limit overrides)
per_run = 200
# cost estimate per model call when system.model_calls has no observed cost yet (USD)
est_usd_audio = 0.0003
est_usd_image = 0.002
