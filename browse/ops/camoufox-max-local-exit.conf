# Camoufox leaves through the owner's real local IP (walter-exit-local, 2026-10-28); read after identity.conf, so it
# overrides the shared default exit. Install as /etc/systemd/system/camoufox-max.service.d/local-exit.conf.
[Unit]
Wants=walter-exit-local.service
After=walter-exit-local.service

[Service]
EnvironmentFile=-/etc/walter/browse-identity-camoufox.env
