# camoufox-max draws on the Selkies display of Walter's browser (walter-browse-display, X :101), visible and usable
# by the owner on Tailscale (https://<tailscale ip>:3011). Replaces the Xvfb + x11vnc + noVNC display (2026-10-20).
[Unit]
Requires=walter-browse-display.service
After=walter-browse-display.service

[Service]
Environment=DISPLAY=:101
Environment=CAMOUFOX_HEADLESS=false
