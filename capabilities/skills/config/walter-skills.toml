# walter-skills — the one configuration file (P10). Content lives in git (skills/, archive/, drafts/); everything
# derived or observed lives in Postgres (schema skills). Values here are the only tunables; code holds no magic numbers.

[service]
url = "http://127.0.0.1:8891"
snapshot_dir = "/opt/walter-skills/.cache/snapshot"   # last-good registry snapshot: the service starts even if Postgres is down

[retrieval]
encoder = "minishlab/potion-multilingual-128M"        # chosen on the bench (MiniLM: same quality, 4x slower)
learner = "hgb"                                         # fusion trained on judged + implicit labels
model_dir = "/opt/walter-memory/models/embeddings"      # shared local embedding models, owned by walter-memory
cache_dir = "/opt/walter-skills/.cache/embeddings"

[policy]
# What the agent sees. The agent's own model always decides what to open; the policy only chooses what to show.
k_max = 15                 # bench: 15 cards = best first pick by the agent (Claude 86 %, luna 78 %)
k_confident = 8            # when the ranker is confident, fewer cards: same recall (held-out 2026-10-10: 95.6 % @8 = @15)
confident_p1 = 0.95        # probability of the first skill above which the ranker counts as confident (61 % of messages)
min_words = 3              # shorter messages get nothing
followup_words = 6         # in an ongoing session, a message shorter than this is a follow-up: nothing new
recent_injections = 3      # a card shown in the session's last N injections is not shown again
refresh_depth = 12         # new topic in an ongoing session: only new cards ranked within this depth
error_max = 2              # after a failed command: at most N skills ...
error_min_symptom = 8.0    # ... whose card symptoms match the specific words of the error (BM25) at least this much
domain_map = true          # first turn of a session: the domain map (tier 0, stable, cache-friendly)

[learning]
judge_per_night = 60       # recent real messages labelled by the judge (calibration + growing eval set)
implicit_weight = 0.5      # "shown then opened by the agent" labels (the model as judge)
miss_weight = 1.0          # "agent searched and opened a skill that was not shown" labels
promote_tolerance = 1.0    # pts; ≈ 1 held-out case — below that, differences are noise
eval_min_cases = 150

[curation]
mode = "active"
shadow_until = "2026-10-23"   # before this date: a git branch curator/<date> + report, master untouched
archive_after_days = 60
max_merges = 5
max_workflows = 3
max_splits = 3
dup_cosine = 0.80
workflow_max_step_cosine = 0.75
workflow_min_sessions = 5
workflow_min_lift = 4.0
generic_session_share = 0.08
cooldown_days = 30
max_chars = 24000
learner_sessions_per_night = 3
always_active = ["drafts"]   # judged one by one, never destructive: applied on master even during the shadow period
max_moves = 400            # organise: folder moves per run (names never change)
max_domain_size = 30       # organise: a domain larger than this (or 'misc') triggers a re-organisation

# Model postes: ordered routes, first that answers wins. via = router (2026-10-16, Monsieur: every module goes through
# Walter Router): `level` = one of Monsieur's text tiers, so the model follows the tier he adopts; Codex routes run in
# W.Alter's own Codex session (no per-token cost), paid ones through the walter-llm gateway. The static codex /
# openrouter routes after it only answer when the router is unreachable.
# The judge's independence from the editor comes from the scripted checks (lossless, retrieval) it complements, and
# from a different tier (L1, Luna today) than the editor (L2, Sol today).
[postes.editor]
routes = [{ via = "router", level = "L2", budget = "recurring" },
          { via = "codex", model = "gpt-6.1-sol", effort = "medium" }]
[postes.indexer]
routes = [{ via = "router", level = "L1", budget = "backfill" },
          { via = "codex", model = "gpt-6-luna", effort = "low" }]
[postes.judge]
routes = [{ via = "router", level = "L1", budget = "recurring" },
          { via = "codex", model = "gpt-6-luna", effort = "medium" }]
