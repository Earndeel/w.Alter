# Exits of the owner's own network (2026-11-11): a session given one of these proxies keeps the owner's browser
# (device, stored state, cookies). Any other session proxy (NordVPN nordvpn-<country>) is a third-party exit: own
# browser process through that exit, no owner state, cookies refused (server-max.js). Install for camoufox-max and
# cloakbrowser-max as /etc/systemd/system/<unit>.service.d/owner-exits.conf.
[Service]
Environment=CAMOFOX_OWNER_EXITS=http://127.0.0.1:1081,socks5://127.0.0.1:1082,socks5://127.0.0.1:1083,socks5://127.0.0.1:1084,http://127.0.0.1:1084
