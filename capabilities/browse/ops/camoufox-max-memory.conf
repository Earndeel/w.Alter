# Memory budget of camoufox-max. Install as /etc/systemd/system/camoufox-max.service.d/10-memory-guard.conf.
# 2026-11-08: the June budget (MemoryHigh 768M) predates the visible display (2026-10-20) and today's heavy web apps:
# one ChatGPT tab filled it within 17 min. At MemoryHigh the kernel throttles and swaps instead of killing, so the
# browser froze silently (every API call timed out while /health stayed green), on 30/10 and 08/11.
# High = the throttling point, kept well above normal use (ChatGPT + YouTube open = 1.2 G anon + 0.5 G cache); Max = a real ceiling where the kernel kills a content
# process (the tab crashes, OOMPolicy=continue keeps the service), and the browse guardian's engine probe restarts a
# browser that stops answering.
[Service]
MemoryHigh=2560M
MemoryMax=3584M
OOMPolicy=continue
